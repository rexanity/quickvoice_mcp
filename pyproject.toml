[project]
name = "quickvoice-mcp"
version = "0.1.0"
description = "A MCP server to communicate with QuickVoice AI Voice agents"
authors = [
    {name = "Rex Chung",email = "rex.chung@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli] (>=1.6.0,<2.0.0)",
    "httpx (>=0.27.0,<0.28.0)",
    "tenacity (>=8.2.3,<9.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"

[[tool.poetry.packages]]
include = "src"

